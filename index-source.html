<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13c9e4"><title>Bubble Brigade</title><link rel="stylesheet" href="style.css"></head>
